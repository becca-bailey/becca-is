name: Sync Substack essays

# Pulls anything published on Substack that is not already in
# src/content/writing and opens a pull request with the converted MDX.
# Imports land as `draft: true`, so nothing reaches the site until the prose
# has been read and the flag flipped — the sync removes the copying, not the
# editorial pass.

on:
  schedule:
    # Mondays at 12:00 UTC.
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      since:
        description: 'Only import posts published on or after this date (YYYY-MM-DD)'
        required: false
        type: string
      reading_path:
        description: 'Reading path slug to tag imports with'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-substack
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Import new posts
        env:
          # Optional: a substack.sid cookie lets the importer read paid posts.
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
        run: |
          node scripts/import-substack.mjs --all \
            ${{ inputs.since && format('--since {0}', inputs.since) || '' }} \
            ${{ inputs.reading_path && format('--path {0}', inputs.reading_path) || '' }}

      - name: Check for new essays
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/content/writing)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            git status --porcelain src/content/writing
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No new posts."
          fi

      # Catches conversion breakage — bad frontmatter or MDX that will not
      # compile — before it ever reaches a pull request.
      - name: Verify the site still builds
        if: steps.changes.outputs.found == 'true'
        run: npm run build

      - name: Open a pull request
        if: steps.changes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=substack-sync

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # If a sync pull request is already open, stack onto its branch so
          # review edits are never force-pushed away. Otherwise start fresh.
          git fetch origin "$BRANCH" --depth 1 || true
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          git add src/content/writing
          if git diff --cached --quiet; then
            echo "Everything new is already on $BRANCH."
            exit 0
          fi
          git commit \
            -m "Import new Substack essays" \
            -m "Added by the scheduled Substack sync. Essays are marked draft: true — read the converted prose, add reading paths and influences, then flip the flag to publish."
          git push -u origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Existing pull request updated."
            exit 0
          fi

          cat > /tmp/pr-body.md <<'BODY'
          New posts from [Performance Anxiety](https://beccabailey.substack.com) converted into `src/content/writing`.

          Each essay is imported as `draft: true`. Before merging and publishing:

          - read the converted markdown for conversion artifacts
          - fill in `readingPaths`, `themes`, `influences`, and `related`
          - set `status` (`original` / `revised` / `expanded`) and `revisedDate` if the site version differs
          - flip `draft` to `false`

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          BODY

          gh pr create \
            --head "$BRANCH" \
            --title "Import new Substack essays" \
            --body-file /tmp/pr-body.md
